[project]
name = "board-game-reco"
version = "0.1.0"
description = "Free text in, one board game and a reason out."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    "openai>=1.60",
]

[dependency-groups]
app = [
    "seaborn>=0.13",
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "nbformat>=5.10",
]
map = [
    "umap-learn>=0.5",
]
ragas = [
    "ragas>=0.4",
    "langchain-community<0.4",
]

[tool.uv]
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model: loads the real ONNX model (downloads about 118 MB once)",
    "network: calls Groq and needs LLM_API_KEY",
    "fp32: loads the real fp32 model (downloads 471 MB), never run in the image",
    "map: needs the map dependency group (umap-learn)",
]
addopts = "-m 'not network and not map'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["board_game_reco"]
