[project]
name = "board-game-reco"
version = "0.1.0"
description = "Free text in, one board game and a reason out."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "nbformat>=5.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "model: loads the real ONNX model (downloads about 118 MB once)",
    "network: calls Groq and needs LLM_API_KEY",
]
addopts = "-m 'not network'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["board_game_reco"]
